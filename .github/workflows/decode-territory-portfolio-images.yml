name: Decode territory portfolio images

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/decode-territory-portfolio-images.yml

permissions:
  contents: write

concurrency:
  group: decode-territory-portfolio-images
  cancel-in-progress: false

jobs:
  decode-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and validate JPEG assets
        shell: python
        run: |
          import base64
          import pathlib
          import re

          root = pathlib.Path.cwd()
          assets = {
              "jack-daniels-holiday-coca-cola.jpg": "jack-daniels-holiday-coca-cola.b64",
              "jack-daniels-patriotic.jpg": "jack-daniels-patriotic.b64",
              "jack-daniels-flavor-portfolio.jpg": "jack-daniels-flavor-portfolio.b64",
              "titos-mule-mug.jpg": "titos-mule-mug.b64",
              "cutwater-stadium.jpg": "cutwater-stadium.b64",
          }
          asset_dir = root / "assets" / "territory-execution"
          data_dir = asset_dir / "data"

          sof_markers = {
              0xC0, 0xC1, 0xC2, 0xC3, 0xC5, 0xC6, 0xC7,
              0xC9, 0xCA, 0xCB, 0xCD, 0xCE, 0xCF,
          }

          def jpeg_dimensions(data: bytes) -> tuple[int, int]:
              if not data.startswith(b"\xff\xd8"):
                  raise ValueError("missing JPEG SOI marker")
              i = 2
              while i + 9 < len(data):
                  if data[i] != 0xFF:
                      i += 1
                      continue
                  while i < len(data) and data[i] == 0xFF:
                      i += 1
                  if i >= len(data):
                      break
                  marker = data[i]
                  i += 1
                  if marker in {0x01, 0xD0, 0xD1, 0xD2, 0xD3, 0xD4, 0xD5, 0xD6, 0xD7, 0xD8, 0xD9}:
                      continue
                  if i + 1 >= len(data):
                      break
                  segment_length = int.from_bytes(data[i:i+2], "big")
                  if segment_length < 2 or i + segment_length > len(data):
                      raise ValueError("invalid JPEG segment length")
                  if marker in sof_markers:
                      height = int.from_bytes(data[i+3:i+5], "big")
                      width = int.from_bytes(data[i+5:i+7], "big")
                      return width, height
                  i += segment_length
              raise ValueError("JPEG dimensions not found")

          for output_name, source_name in assets.items():
              source = data_dir / source_name
              encoded = re.sub(r"\s+", "", source.read_text(encoding="utf-8"))
              data = base64.b64decode(encoded, validate=True)
              if not data.endswith(b"\xff\xd9"):
                  raise ValueError(f"{source_name}: missing JPEG EOI marker")
              width, height = jpeg_dimensions(data)
              if width < 180 or height < 240 or len(data) < 15000:
                  raise ValueError(
                      f"{source_name}: invalid dimensions/size {width}x{height}, {len(data)} bytes"
                  )
              destination = asset_dir / output_name
              destination.write_bytes(data)
              print(f"decoded {output_name}: {width}x{height}, {len(data)} bytes")

          page = root / "territory-sales-execution.html"
          html = page.read_text(encoding="utf-8")
          placeholder = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
          for output_name, source_name in assets.items():
              html = html.replace(
                  f'src="{placeholder}" data-b64="assets/territory-execution/data/{source_name}"',
                  f'src="assets/territory-execution/{output_name}?v=20260726-final"',
              )

          html = re.sub(
              r"\.photo img\[data-b64\]\{[^}]*\}\.photo img\[data-b64\]\.is-loaded\{[^}]*\}",
              "",
              html,
          )
          html = re.sub(
              r"\n\s*<script>\s*\(\(\) => \{.*?</script>",
              "",
              html,
              flags=re.DOTALL,
          )
          if "data-b64=" in html or "decodeBase64Image" in html:
              raise ValueError("Base64 browser loader was not fully removed")
          for output_name in assets:
              expected = f'assets/territory-execution/{output_name}?v=20260726-final'
              if expected not in html:
                  raise ValueError(f"HTML is missing {expected}")
          page.write_text(html, encoding="utf-8")

      - name: Verify decoded files
        run: |
          set -euo pipefail
          file assets/territory-execution/jack-daniels-holiday-coca-cola.jpg
          file assets/territory-execution/jack-daniels-patriotic.jpg
          file assets/territory-execution/jack-daniels-flavor-portfolio.jpg
          file assets/territory-execution/titos-mule-mug.jpg
          file assets/territory-execution/cutwater-stadium.jpg
          grep -q 'jack-daniels-holiday-coca-cola.jpg?v=20260726-final' territory-sales-execution.html
          ! grep -q 'data-b64=' territory-sales-execution.html

      - name: Commit decoded images and page
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add territory-sales-execution.html \
            assets/territory-execution/jack-daniels-holiday-coca-cola.jpg \
            assets/territory-execution/jack-daniels-patriotic.jpg \
            assets/territory-execution/jack-daniels-flavor-portfolio.jpg \
            assets/territory-execution/titos-mule-mug.jpg \
            assets/territory-execution/cutwater-stadium.jpg
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Decode and publish spirit portfolio images"
          git push origin HEAD:main
