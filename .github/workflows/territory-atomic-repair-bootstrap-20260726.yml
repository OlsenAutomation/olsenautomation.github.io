name: Bootstrap guarded atomic territory repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/territory-atomic-repair-bootstrap-20260726.yml

permissions:
  contents: write

concurrency:
  group: territory-atomic-repair-bootstrap-20260726
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BOOTSTRAP_PATH: .github/workflows/territory-atomic-repair-bootstrap-20260726.yml
      CACHE_KEY: 20260726-source-reupload-final
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate the temporary bootstrap commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          parent=$(git rev-parse HEAD^)
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test "$(git diff --name-only "$parent" "$GITHUB_SHA")" = "$BOOTSTRAP_PATH"
          echo "BOOTSTRAP_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "BASE_PARENT=$parent" >> "$GITHUB_ENV"

      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Recover and identify all six validated JPEG objects
        shell: python
        run: |
          import base64
          import hashlib
          import io
          import json
          import os
          import pathlib
          import urllib.request

          import numpy as np
          from PIL import Image

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          out = pathlib.Path("/tmp/territory-replacements")
          out.mkdir(parents=True, exist_ok=True)
          blob_shas = [
              "ce6a856d8514fbf39e1b87da5944b6ab0c0dd41e",
              "5c3b30319506c463ffbdd70b1d030911413f6b57",
              "f68e7bdb15d503f26b2c8ca90297a974250523ff",
              "31d3d1c309f51167ac22e8229e72bfc8c46eaede",
              "c3903a94904d1ded6b1d651f771d818a05b12349",
              "c3721b2a6c38b2847f439c110344e7e24c1c8f0c",
              "01626896a09194adc6ac6534a9211310c50cbde2",
          ]

          def fetch_blob(sha):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/git/blobs/{sha}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "territory-atomic-repair",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              raw = base64.b64decode(payload["content"], validate=True)
              if len(raw) != payload["size"]:
                  raise RuntimeError(f"{sha}: API size mismatch")
              return raw

          def metrics(image):
              sample = image.convert("RGB").resize((180, 240), Image.Resampling.LANCZOS)
              hsv = np.asarray(sample.convert("HSV"), dtype=np.float32) / 255.0
              h, s, v = hsv[:, :, 0], hsv[:, :, 1], hsv[:, :, 2]
              top = np.zeros_like(h, dtype=bool); top[:145, :] = True
              lower = np.zeros_like(h, dtype=bool); lower[100:, :] = True
              def frac(mask, region=None):
                  if region is None:
                      return float(mask.mean())
                  return float((mask & region).sum()) / float(region.sum())
              red = (((h < .055) | (h > .965)) & (s > .43) & (v > .22))
              orange = ((h >= .035) & (h < .125) & (s > .34) & (v > .25))
              yellow = ((h >= .125) & (h < .205) & (s > .43) & (v > .42))
              green = ((h >= .205) & (h < .455) & (s > .30) & (v > .20))
              teal = ((h >= .43) & (h < .59) & (s > .28) & (v > .22))
              blue = ((h >= .56) & (h < .76) & (s > .32) & (v > .24))
              neutral = ((s < .24) & (v > .30) & (v < .92))
              white = ((s < .20) & (v > .72))
              dark = v < .28
              return {
                  "red": frac(red), "red_lower": frac(red, lower),
                  "orange": frac(orange), "orange_top": frac(orange, top),
                  "yellow": frac(yellow), "yellow_top": frac(yellow, top),
                  "green": frac(green), "green_lower": frac(green, lower),
                  "teal": frac(teal), "blue": frac(blue),
                  "neutral_top": frac(neutral, top),
                  "white_lower": frac(white, lower), "dark_top": frac(dark, top),
              }

          records = []
          for sha in blob_shas:
              raw = fetch_blob(sha)
              try:
                  with Image.open(io.BytesIO(raw)) as check:
                      if check.format != "JPEG":
                          continue
                      check.verify()
                  with Image.open(io.BytesIO(raw)) as image:
                      image.load()
                      if image.size != (900, 1200):
                          raise RuntimeError(f"expected 900x1200, got {image.size}")
                      if image.info.get("progressive") or image.info.get("progression"):
                          raise RuntimeError("progressive JPEG is not allowed")
                      scene = metrics(image)
              except Exception as error:
                  if raw.startswith(b"\xff\xd8"):
                      raise RuntimeError(f"{sha}: invalid JPEG: {error}") from error
                  continue
              if not raw.endswith(b"\xff\xd9") or len(raw) < 25_000:
                  raise RuntimeError(f"{sha}: incomplete or suspiciously small JPEG")
              records.append({
                  "sha": sha,
                  "raw": raw,
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "bytes": len(raw),
                  "metrics": scene,
              })

          if len(records) != 6:
              raise RuntimeError(f"Expected six valid JPEGs, found {len(records)}")

          remaining = list(records)
          def take(label, score):
              record = max(remaining, key=score)
              remaining.remove(record)
              record["label"] = label
              return record

          football = take("jack-daniels-football-feature.jpg", lambda r: 2.2*r["metrics"]["yellow_top"] + r["metrics"]["yellow"])
          holiday = take("jack-daniels-holiday-coca-cola.jpg", lambda r: 1.5*r["metrics"]["red"] + .45*r["metrics"]["red_lower"])
          titos = take("titos-mule-mug.jpg", lambda r: 1.8*r["metrics"]["orange_top"] + .35*r["metrics"]["white_lower"] + .15*r["metrics"]["dark_top"])
          cutwater = take("cutwater-stadium.jpg", lambda r: 1.8*r["metrics"]["teal"] + .25*r["metrics"]["orange"])
          flavor = take("jack-daniels-flavor-portfolio.jpg", lambda r: 1.5*r["metrics"]["green_lower"] + .35*r["metrics"]["red_lower"] + .15*r["metrics"]["yellow"])
          patriotic = remaining.pop(); patriotic["label"] = "jack-daniels-patriotic.jpg"
          assigned = [holiday, patriotic, flavor, titos, football, cutwater]

          sanity = {
              "football": football["metrics"]["yellow_top"] > .006,
              "holiday": holiday["metrics"]["red"] > .025,
              "titos": titos["metrics"]["orange_top"] > .025,
              "cutwater": cutwater["metrics"]["teal"] > .018,
              "flavor": flavor["metrics"]["green_lower"] > .025,
              "patriotic-wall": patriotic["metrics"]["neutral_top"] > .20,
              "patriotic-blue": patriotic["metrics"]["blue"] > .004,
          }
          if not all(sanity.values()):
              raise RuntimeError(f"Scene identification failed: {sanity}")

          manifest = {}
          for record in assigned:
              (out / record["label"]).write_bytes(record["raw"])
              manifest[record["label"]] = {
                  "source_blob": record["sha"],
                  "sha256": record["sha256"],
                  "bytes": record["bytes"],
                  "dimensions": [900, 1200],
                  "metrics": record["metrics"],
              }
          (out / "manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True))
          print(json.dumps(manifest, indent=2, sort_keys=True))

      - name: Build a safe fast-forward repair commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/territory-execution
          cp /tmp/territory-replacements/*.jpg assets/territory-execution/
          python - <<'PY'
          import os, pathlib, re
          page = pathlib.Path("territory-sales-execution.html")
          html = page.read_text(encoding="utf-8")
          key = os.environ["CACHE_KEY"]
          names = [
              "jack-daniels-holiday-coca-cola.jpg",
              "jack-daniels-patriotic.jpg",
              "jack-daniels-flavor-portfolio.jpg",
              "titos-mule-mug.jpg",
              "jack-daniels-football-feature.jpg",
              "cutwater-stadium.jpg",
          ]
          html = html.replace("Five spirit-forward examples demonstrating", "Six spirit-forward examples demonstrating")
          for name in names:
              if name == "jack-daniels-football-feature.jpg" and name not in html:
                  continue
              pattern = rf"assets/territory-execution/{re.escape(name)}(?:\?v=[^\"\s]+)?"
              html, count = re.subn(pattern, f"assets/territory-execution/{name}?v={key}", html)
              if count != 1:
                  raise RuntimeError(f"Expected one existing reference for {name}, found {count}")
          if "jack-daniels-football-feature.jpg" not in html:
              marker = '<div class="photo"><img loading="lazy" src="assets/territory-execution/cutwater-stadium.jpg'
              image_at = html.find(marker)
              article_at = html.rfind('        <article class="work">', 0, image_at)
              if image_at < 0 or article_at < 0:
                  raise RuntimeError("Could not locate football-card insertion point")
              card = f'''        <article class="work">
          <figure>
            <div class="photo"><img loading="lazy" src="assets/territory-execution/jack-daniels-football-feature.jpg?v={key}" alt="Jack Daniel's football-themed retail display with a custom goalpost and branded football"></div>
            <figcaption class="work-copy"><span class="tag">Sports occasion</span><h3>Jack Daniel’s football feature</h3><p>A custom goalpost, oversized branded football, seasonal balloons, disciplined case mass, and visible pricing turn a game-day program into a high-impact destination.</p></figcaption>
          </figure>
        </article>
'''
              html = html[:article_at] + card + html[article_at:]
          spirits = html[html.index('<section id="spirits"'):html.index('<section id="wine"')]
          for name in names:
              ref = f"assets/territory-execution/{name}?v={key}"
              if spirits.count(ref) != 1:
                  raise RuntimeError(f"Expected exactly one standard image reference: {ref}")
          forbidden = ["data-b64=", "decodeBase64Image", "Image temporarily unavailable", "territory-execution/data/", ".b64", "data:image/"]
          if any(token in html for token in forbidden):
              raise RuntimeError("Legacy image workaround remains")
          if spirits.count('<article class="work">') != 6:
              raise RuntimeError("Spirits gallery does not contain six cards")
          page.write_text(html, encoding="utf-8")
          PY
          python - <<'PY'
          import hashlib, json, pathlib
          from PIL import Image
          manifest = json.loads(pathlib.Path("/tmp/territory-replacements/manifest.json").read_text())
          for name, expected in manifest.items():
              path = pathlib.Path("assets/territory-execution") / name
              raw = path.read_bytes()
              if hashlib.sha256(raw).hexdigest() != expected["sha256"]:
                  raise RuntimeError(f"{name}: hash mismatch")
              with Image.open(path) as check: check.verify()
              with Image.open(path) as image:
                  image.load()
                  if image.format != "JPEG" or image.size != (900, 1200):
                      raise RuntimeError(f"{name}: invalid full decode")
                  if image.info.get("progressive") or image.info.get("progression"):
                      raise RuntimeError(f"{name}: progressive JPEG")
          PY
          git rm "$BOOTSTRAP_PATH"
          expected=$(cat <<'EOF'
          .github/workflows/territory-atomic-repair-bootstrap-20260726.yml
          assets/territory-execution/cutwater-stadium.jpg
          assets/territory-execution/jack-daniels-flavor-portfolio.jpg
          assets/territory-execution/jack-daniels-football-feature.jpg
          assets/territory-execution/jack-daniels-holiday-coca-cola.jpg
          assets/territory-execution/jack-daniels-patriotic.jpg
          assets/territory-execution/titos-mule-mug.jpg
          territory-sales-execution.html
          EOF
          )
          actual=$(git status --porcelain=v1 | sed 's/^...//' | LC_ALL=C sort)
          test "$actual" = "$(printf '%s\n' "$expected" | sed 's/^          //' | LC_ALL=C sort)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stage validated territory portfolio repair"
          repair_sha=$(git rev-parse HEAD)
          echo "REPAIR_SHA=$repair_sha" >> "$GITHUB_ENV"
          git push --force-with-lease=refs/heads/main:$BOOTSTRAP_SHA origin HEAD:main
          rm -rf /tmp/territory-final-tree
          mkdir -p /tmp/territory-final-tree/assets/territory-execution
          cp territory-sales-execution.html /tmp/territory-final-tree/
          cp assets/territory-execution/{cutwater-stadium,jack-daniels-flavor-portfolio,jack-daniels-football-feature,jack-daniels-holiday-coca-cola,jack-daniels-patriotic,titos-mule-mug}.jpg /tmp/territory-final-tree/assets/territory-execution/

      - name: Replace bootstrap history with the one atomic seven-file commit
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$BASE_PARENT"
          mkdir -p assets/territory-execution
          cp /tmp/territory-final-tree/territory-sales-execution.html .
          cp /tmp/territory-final-tree/assets/territory-execution/*.jpg assets/territory-execution/
          git add \
            territory-sales-execution.html \
            assets/territory-execution/cutwater-stadium.jpg \
            assets/territory-execution/jack-daniels-flavor-portfolio.jpg \
            assets/territory-execution/jack-daniels-football-feature.jpg \
            assets/territory-execution/jack-daniels-holiday-coca-cola.jpg \
            assets/territory-execution/jack-daniels-patriotic.jpg \
            assets/territory-execution/titos-mule-mug.jpg
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 7
          git commit -m "Replace territory portfolio images with validated JPEGs"
          test "$(git rev-parse HEAD^)" = "$BASE_PARENT"
          final_sha=$(git rev-parse HEAD)
          echo "FINAL_SHA=$final_sha" >> "$GITHUB_ENV"
          git push --force-with-lease=refs/heads/main:$REPAIR_SHA origin HEAD:main

      - name: Verify live production page and every JPEG download
        shell: python
        run: |
          import hashlib, io, json, os, pathlib, time, urllib.request
          from PIL import Image
          key = os.environ["CACHE_KEY"]
          final_sha = os.environ["FINAL_SHA"]
          manifest = json.loads(pathlib.Path("/tmp/territory-replacements/manifest.json").read_text())
          def get(url):
              request = urllib.request.Request(url, headers={"Cache-Control":"no-cache", "Pragma":"no-cache", "User-Agent":"territory-production-verifier"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read(), response.headers.get("Content-Type", "")
          page_url = f"https://olsenautomation.com/territory-sales-execution.html?verify={final_sha}"
          page = None
          last = None
          for attempt in range(48):
              try:
                  raw, _ = get(page_url + f"&attempt={attempt}")
                  candidate = raw.decode("utf-8")
                  if key in candidate and "jack-daniels-football-feature.jpg" in candidate:
                      page = candidate
                      break
                  last = "new HTML not visible"
              except Exception as error:
                  last = str(error)
              time.sleep(15)
          if page is None:
              raise RuntimeError(f"Production page not published: {last}")
          evidence = {"commit":final_sha, "cache_key":key, "page":page_url, "images":{}}
          for name, expected in manifest.items():
              url = f"https://olsenautomation.com/assets/territory-execution/{name}?v={key}&verify={final_sha}"
              raw, content_type = get(url)
              digest = hashlib.sha256(raw).hexdigest()
              if digest != expected["sha256"] or "image/jpeg" not in content_type.lower():
                  raise RuntimeError(f"{name}: production bytes or MIME type do not match")
              with Image.open(io.BytesIO(raw)) as check: check.verify()
              with Image.open(io.BytesIO(raw)) as image:
                  image.load()
                  if image.format != "JPEG" or image.size != (900,1200):
                      raise RuntimeError(f"{name}: production full decode failed")
                  if image.info.get("progressive") or image.info.get("progression"):
                      raise RuntimeError(f"{name}: progressive production JPEG")
              evidence["images"][name] = {"url":url, "sha256":digest, "bytes":len(raw), "content_type":content_type, "dimensions":[900,1200], "full_decode":True}
          pathlib.Path("production-verification.json").write_text(json.dumps(evidence, indent=2, sort_keys=True))
          print(json.dumps(evidence, indent=2, sort_keys=True))

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: territory-production-verification-${{ env.FINAL_SHA }}
          path: production-verification.json
          retention-days: 30
          if-no-files-found: error

      - name: Restore prior head if bootstrap failed before publishing a repair
        if: failure()
        shell: bash
        run: |
          set +e
          git fetch --no-tags origin main
          current=$(git rev-parse origin/main 2>/dev/null)
          bootstrap=${BOOTSTRAP_SHA:-$GITHUB_SHA}
          parent=${BASE_PARENT:-$(git rev-parse "$GITHUB_SHA^" 2>/dev/null)}
          if [ "$current" = "$bootstrap" ] && [ -n "$parent" ]; then
            git push --force-with-lease=refs/heads/main:$bootstrap origin "$parent":main
          fi
