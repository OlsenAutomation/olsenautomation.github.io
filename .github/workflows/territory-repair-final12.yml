name: Guarded seven-file territory repair final12
on:
  push:
    branches: [territory-repair-final12]
    paths: [.github/workflows/territory-repair-final12.yml]
permissions:
  contents: write
concurrency:
  group: territory-repair-final12
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BRANCH: territory-repair-final12
      WF: .github/workflows/territory-repair-final12.yml
      KEY: 20260726-source-reupload-final
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: territory-repair-final12
          fetch-depth: 0
      - name: Gate exact source state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          base=$(git rev-parse HEAD^)
          test "$(git diff --name-only "$base" HEAD)" = "$WF"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$base"
          echo "BASE=$base" >> "$GITHUB_ENV"
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Recover, decode, and identify six JPEGs
        shell: python
        run: |
          import base64,hashlib,io,json,os,pathlib,urllib.request
          from PIL import Image
          shas='ce6a856d8514fbf39e1b87da5944b6ab0c0dd41e 5c3b30319506c463ffbdd70b1d030911413f6b57 f68e7bdb15d503f26b2c8ca90297a974250523ff 31d3d1c309f51167ac22e8229e72bfc8c46eaede c3903a94904d1ded6b1d651f771d818a05b12349 c3721b2a6c38b2847f439c110344e7e24c1c8f0c 01626896a09194adc6ac6534a9211310c50cbde2'.split()
          out=pathlib.Path('/tmp/territory');out.mkdir()
          def fetch(sha):
            q=urllib.request.Request(f'https://api.github.com/repos/{os.environ["REPO"]}/git/blobs/{sha}',headers={'Authorization':f'Bearer {os.environ["GH_TOKEN"]}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'territory-repair'})
            with urllib.request.urlopen(q,timeout=30) as r:d=json.load(r)
            b=base64.b64decode(d['content'],validate=True)
            if len(b)!=d['size']:raise RuntimeError(f'{sha}: size mismatch')
            return b
          def met(im):
            p=list(im.convert('RGB').resize((180,240),Image.Resampling.LANCZOS).convert('HSV').getdata())
            def f(t,a=0,z=240):return sum(t(h/255,s/255,v/255) for y in range(a,z) for h,s,v in p[y*180:(y+1)*180])/((z-a)*180)
            return {'red':f(lambda h,s,v:(h<.055 or h>.965) and s>.43 and v>.22),'redlow':f(lambda h,s,v:(h<.055 or h>.965) and s>.43 and v>.22,100),'orange':f(lambda h,s,v:.035<=h<.125 and s>.34 and v>.25),'orangetop':f(lambda h,s,v:.035<=h<.125 and s>.34 and v>.25,0,145),'yellow':f(lambda h,s,v:.125<=h<.205 and s>.43 and v>.42),'yellowtop':f(lambda h,s,v:.125<=h<.205 and s>.43 and v>.42,0,145),'greenlow':f(lambda h,s,v:.205<=h<.455 and s>.30 and v>.20,100),'teal':f(lambda h,s,v:.43<=h<.59 and s>.28 and v>.22),'blue':f(lambda h,s,v:.56<=h<.76 and s>.32 and v>.24),'neutral':f(lambda h,s,v:s<.24 and .30<v<.92,0,145)}
          rows=[]
          for sha in shas:
            b=fetch(sha)
            try:
              with Image.open(io.BytesIO(b)) as x:
                if x.format!='JPEG':continue
                x.verify()
              with Image.open(io.BytesIO(b)) as x:
                x.load()
                if x.size!=(900,1200) or x.info.get('progressive') or x.info.get('progression'):raise RuntimeError(f'{sha}: invalid JPEG properties')
                m=met(x)
            except Exception as e:
              if b.startswith(b'\xff\xd8'):raise RuntimeError(f'{sha}: incomplete JPEG: {e}')
              continue
            if len(b)<25000 or not b.endswith(b'\xff\xd9'):raise RuntimeError(f'{sha}: truncated JPEG')
            rows.append({'sha':sha,'b':b,'m':m,'hash':hashlib.sha256(b).hexdigest()})
          if len(rows)!=6:raise RuntimeError(f'expected six JPEGs, found {len(rows)}')
          rem=rows[:]
          def take(n,s):x=max(rem,key=s);rem.remove(x);x['name']=n;return x
          football=take('jack-daniels-football-feature.jpg',lambda x:2.2*x['m']['yellowtop']+x['m']['yellow'])
          holiday=take('jack-daniels-holiday-coca-cola.jpg',lambda x:1.5*x['m']['red']+.45*x['m']['redlow'])
          titos=take('titos-mule-mug.jpg',lambda x:1.8*x['m']['orangetop']+.2*x['m']['orange'])
          cutwater=take('cutwater-stadium.jpg',lambda x:1.8*x['m']['teal']+.15*x['m']['orange'])
          flavor=take('jack-daniels-flavor-portfolio.jpg',lambda x:1.5*x['m']['greenlow']+.35*x['m']['redlow']+.15*x['m']['yellow'])
          patriotic=rem.pop();patriotic['name']='jack-daniels-patriotic.jpg'
          checks=[football['m']['yellowtop']>.006,holiday['m']['red']>.025,titos['m']['orangetop']>.025,cutwater['m']['teal']>.018,flavor['m']['greenlow']>.025,patriotic['m']['neutral']>.20,patriotic['m']['blue']>.004]
          if not all(checks):raise RuntimeError(f'scene checks failed: {checks}')
          manifest={}
          for x in [holiday,patriotic,flavor,titos,football,cutwater]:
            (out/x['name']).write_bytes(x['b']);manifest[x['name']]={'sha256':x['hash'],'bytes':len(x['b']),'source_blob':x['sha']}
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True))
      - name: Build exact seven-file commit
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$BASE"
          mkdir -p assets/territory-execution
          cp /tmp/territory/*.jpg assets/territory-execution/
          python - <<'PY'
          import os,pathlib,re
          p=pathlib.Path('territory-sales-execution.html');h=p.read_text();k=os.environ['KEY']
          names=['jack-daniels-holiday-coca-cola.jpg','jack-daniels-patriotic.jpg','jack-daniels-flavor-portfolio.jpg','titos-mule-mug.jpg','jack-daniels-football-feature.jpg','cutwater-stadium.jpg']
          h=h.replace('Five spirit-forward examples demonstrating','Six spirit-forward examples demonstrating')
          for n in names:
            if n=='jack-daniels-football-feature.jpg' and n not in h:continue
            h,c=re.subn(rf'assets/territory-execution/{re.escape(n)}(?:\?v=[^"\s]+)?',f'assets/territory-execution/{n}?v={k}',h)
            if c!=1:raise RuntimeError(f'{n}: expected one old reference, found {c}')
          if 'jack-daniels-football-feature.jpg' not in h:
            marker='<div class="photo"><img loading="lazy" src="assets/territory-execution/cutwater-stadium.jpg';i=h.find(marker);a=h.rfind('        <article class="work">',0,i)
            if i<0 or a<0:raise RuntimeError('football insertion point missing')
            card=f'''        <article class="work">
          <figure>
            <div class="photo"><img loading="lazy" src="assets/territory-execution/jack-daniels-football-feature.jpg?v={k}" alt="Jack Daniel's football-themed retail display with a custom goalpost and branded football"></div>
            <figcaption class="work-copy"><span class="tag">Sports occasion</span><h3>Jack Daniel’s football feature</h3><p>A custom goalpost, oversized branded football, seasonal balloons, disciplined case mass, and visible pricing turn a game-day program into a high-impact destination.</p></figcaption>
          </figure>
        </article>
''';h=h[:a]+card+h[a:]
          s=h[h.index('<section id="spirits"'):h.index('<section id="wine"')]
          if s.count('<article class="work">')!=6:raise RuntimeError('spirits card count is not six')
          for n in names:
            if s.count(f'assets/territory-execution/{n}?v={k}')!=1:raise RuntimeError(f'{n}: final reference mismatch')
          for x in ['data-b64=','decodeBase64Image','Image temporarily unavailable','territory-execution/data/','.b64','data:image/']:
            if x in h:raise RuntimeError(f'legacy workaround remains: {x}')
          p.write_text(h)
          PY
          python - <<'PY'
          import hashlib,json,pathlib
          from PIL import Image
          m=json.loads(pathlib.Path('/tmp/territory/manifest.json').read_text())
          for n,e in m.items():
            p=pathlib.Path('assets/territory-execution')/n;b=p.read_bytes()
            if hashlib.sha256(b).hexdigest()!=e['sha256']:raise RuntimeError(f'{n}: hash changed')
            with Image.open(p) as x:x.verify()
            with Image.open(p) as x:
              x.load()
              if x.format!='JPEG' or x.size!=(900,1200) or x.info.get('progressive') or x.info.get('progression'):raise RuntimeError(f'{n}: full decode failed')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add territory-sales-execution.html assets/territory-execution/{cutwater-stadium,jack-daniels-flavor-portfolio,jack-daniels-football-feature,jack-daniels-holiday-coca-cola,jack-daniels-patriotic,titos-mule-mug}.jpg
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 7
          git commit -m 'Replace territory portfolio images with validated JPEGs'
          test "$(git rev-parse HEAD^)" = "$BASE"
          final=$(git rev-parse HEAD);echo "FINAL=$final" >> "$GITHUB_ENV"
      - name: Reconfirm main and fast-forward once
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          git push origin HEAD:main
      - name: Verify production downloads and complete decode
        shell: python
        run: |
          import hashlib,io,json,os,pathlib,time,urllib.request
          from PIL import Image
          k=os.environ['KEY'];sha=os.environ['FINAL'];m=json.loads(pathlib.Path('/tmp/territory/manifest.json').read_text())
          def get(u):
            q=urllib.request.Request(u,headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'territory-production-verifier'})
            with urllib.request.urlopen(q,timeout=30) as r:return r.read(),r.headers.get('Content-Type','')
          page=f'https://olsenautomation.com/territory-sales-execution.html?verify={sha}';html=None
          for i in range(48):
            try:
              b,_=get(page+f'&attempt={i}');c=b.decode()
              if k in c and 'jack-daniels-football-feature.jpg' in c:html=c;break
            except Exception:pass
            time.sleep(15)
          if html is None:raise RuntimeError('new production HTML did not publish')
          ev={'commit':sha,'page':page,'cache_key':k,'images':{}}
          for n,e in m.items():
            u=f'https://olsenautomation.com/assets/territory-execution/{n}?v={k}&verify={sha}';b,t=get(u);d=hashlib.sha256(b).hexdigest()
            if d!=e['sha256'] or 'image/jpeg' not in t.lower():raise RuntimeError(f'{n}: production bytes/MIME mismatch')
            with Image.open(io.BytesIO(b)) as x:x.verify()
            with Image.open(io.BytesIO(b)) as x:
              x.load()
              if x.format!='JPEG' or x.size!=(900,1200) or x.info.get('progressive') or x.info.get('progression'):raise RuntimeError(f'{n}: production decode failed')
            ev['images'][n]={'url':u,'sha256':d,'bytes':len(b),'content_type':t,'dimensions':[900,1200],'full_decode':True}
          pathlib.Path('production-verification.json').write_text(json.dumps(ev,indent=2,sort_keys=True));print(json.dumps(ev,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: territory-production-verification-${{ env.FINAL }}
          path: production-verification.json
          retention-days: 30
          if-no-files-found: error
      - name: Remove repair branch after verified production
        if: success()
        run: git push origin --delete "$BRANCH" || true
      - name: Roll main back if production verification failed
        if: failure()
        shell: bash
        run: |
          set +e
          if [ -n "${FINAL:-}" ]; then
            git fetch --no-tags origin main
            current=$(git rev-parse origin/main 2>/dev/null)
            if [ "$current" = "$FINAL" ]; then git push --force-with-lease=refs/heads/main:$FINAL origin "$BASE":main; fi
          fi
