name: Probe registered transfer bundle

on:
  push:
    branches:
      - verification/territory-production-aa113034
    paths:
      - .github/workflows/verify-territory-production.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Try registered-file download endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          urls=(
            'https://sdmntprcentralus.oaiusercontent.com/files/00000000-9360-81f5-ad1d-5a7c8c6a10ef/raw'
            'https://files.oaiusercontent.com/files/00000000-9360-81f5-ad1d-5a7c8c6a10ef/raw'
            'https://chatgpt.com/backend-api/files/file_00000000936081f5ad1d5a7c8c6a10ef/download'
          )
          found=''
          n=0
          for url in "${urls[@]}"; do
            n=$((n + 1))
            echo "Trying candidate ${n}: ${url}"
            if curl --fail --location --silent --show-error \
              --connect-timeout 20 --max-time 90 \
              -A 'Mozilla/5.0' \
              -D "probe/candidate-${n}.headers" \
              -o "probe/candidate-${n}.bin" \
              "$url"; then
              file "probe/candidate-${n}.bin" || true
              wc -c "probe/candidate-${n}.bin"
              if unzip -t "probe/candidate-${n}.bin"; then
                found="probe/candidate-${n}.bin"
                break
              fi
            fi
          done
          if [[ -z "$found" ]]; then
            echo 'No candidate endpoint returned a valid ZIP.' >&2
            exit 1
          fi
          cp "$found" probe/registered-bundle.zip
          unzip -q probe/registered-bundle.zip -d probe/unpacked
          find probe/unpacked -type f -printf '%P %s bytes\n' | sort
          sha256sum probe/registered-bundle.zip

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registered-transfer-bundle-probe
          path: probe/
          if-no-files-found: warn
          retention-days: 2
