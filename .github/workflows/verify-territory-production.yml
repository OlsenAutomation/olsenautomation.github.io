name: Verify deployed territory portfolio repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-territory-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch and diagnose deployed source
        id: diagnose
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production source
          base='https://olsenautomation.com'
          raw='https://raw.githubusercontent.com/OlsenAutomation/olsenautomation.github.io/aa113034d0ab8ba3de064cbe181d665796ab94aa'
          nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          curl --fail --location --silent --show-error \
            -H 'Cache-Control: no-cache, no-store, max-age=0' \
            -D production/page.headers \
            -o production/page.html \
            "${base}/territory-sales-execution.html?verify=${nonce}"
          curl --fail --location --silent --show-error -o source/page.html "${raw}/territory-sales-execution.html"
          curl --fail --location --silent --show-error -o source/index.html "${raw}/index.html"
          curl --fail --location --silent --show-error -o source/sitemap.xml "${raw}/sitemap.xml"

          grep -Fqi 'content-type: text/html' production/page.headers
          grep -Fq '<meta name="robots" content="noindex,nofollow,noarchive">' production/page.html
          ! grep -Eq 'data-b64|decodeBase64Image|Image temporarily unavailable|data:image|\.webp|sprite' production/page.html
          ! grep -Fq 'territory-sales-execution' source/index.html
          ! grep -Fq 'territory-sales-execution' source/sitemap.xml

          images=(
            jack-daniels-holiday-coca-cola.jpg
            jack-daniels-patriotic.jpg
            jack-daniels-flavor-portfolio.jpg
            titos-mule-mug.jpg
            cutwater-stadium.jpg
          )

          for image in "${images[@]}"; do
            grep -Fq "assets/territory-execution/${image}?v=20260726-definitive" production/page.html
            curl --fail --location --silent --show-error \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -D "production/${image}.headers" \
              -o "production/${image}" \
              "${base}/assets/territory-execution/${image}?verify=${nonce}"
            curl --fail --location --silent --show-error \
              -o "source/${image}" \
              "${raw}/assets/territory-execution/${image}"
            grep -Fqi 'content-type: image/jpeg' "production/${image}.headers"
            cmp --silent "production/${image}" "source/${image}"
          done

          python -m pip install --disable-pip-version-check --quiet 'Pillow>=11,<12'
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          names = [
              'jack-daniels-holiday-coca-cola.jpg',
              'jack-daniels-patriotic.jpg',
              'jack-daniels-flavor-portfolio.jpg',
              'titos-mule-mug.jpg',
              'cutwater-stadium.jpg',
          ]
          lines = []
          failures = []
          for name in names:
              path = Path('production') / name
              try:
                  raw = path.read_bytes()
                  if not raw.startswith(b'\xff\xd8'):
                      raise ValueError('missing JPEG SOI marker')
                  if not raw.endswith(b'\xff\xd9'):
                      raise ValueError('missing JPEG EOI marker')
                  with Image.open(path) as image:
                      if image.format != 'JPEG':
                          raise ValueError(f'unexpected format {image.format}')
                      size = image.size
                      image.verify()
                  with Image.open(path) as image:
                      image.load()
                  lines.append(f'PASS {name}: {size[0]}x{size[1]}, {len(raw)} bytes')
              except BaseException as exc:
                  failures.append(name)
                  lines.append(f'FAIL {name}: {type(exc).__name__}: {exc}')
          lines.append('RESULT: ' + ('FAIL' if failures else 'PASS'))
          report = '\n'.join(lines) + '\n'
          Path('production/decode-report.txt').write_text(report, encoding='utf-8')
          print(report, end='')
          if failures:
              raise SystemExit(1)
          PY

      - name: Upload direct production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: territory-production-diagnostics
          path: production/
          if-no-files-found: error
          retention-days: 14

      - name: Final verification gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat production/decode-report.txt
          grep -Fxq 'RESULT: PASS' production/decode-report.txt
          test '${{ steps.diagnose.outcome }}' = 'success'
