name: Inventory territory image assets

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-territory-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main repository state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Build JPEG inventory and contact sheet
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet 'Pillow>=11,<12'
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import hashlib

          root = Path('assets/territory-execution')
          paths = sorted(p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.jpg', '.jpeg', '.png', '.webp'})
          report = []
          cards = []
          for path in paths:
              rel = str(path)
              try:
                  with Image.open(path) as im:
                      fmt = im.format
                      size = im.size
                      im.load()
                      rgb = im.convert('RGB')
                  status = 'VALID'
                  thumb = rgb.copy()
                  thumb.thumbnail((280, 300))
              except Exception as exc:
                  fmt = 'ERROR'
                  size = (0, 0)
                  status = f'{type(exc).__name__}: {exc}'
                  thumb = Image.new('RGB', (280, 300), '#dddddd')
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              report.append(f'{rel}\t{path.stat().st_size}\t{fmt}\t{size[0]}x{size[1]}\t{digest}\t{status}')
              card = Image.new('RGB', (320, 380), 'white')
              card.paste(thumb, ((320-thumb.width)//2, 8))
              draw = ImageDraw.Draw(card)
              label = rel.replace('assets/territory-execution/', '')
              lines = [label[i:i+42] for i in range(0, len(label), 42)]
              y = 315
              for line in lines[:2]:
                  draw.text((8, y), line, fill='black')
                  y += 15
              draw.text((8, 350), f'{fmt} {size[0]}x{size[1]} {path.stat().st_size} B', fill='black')
              cards.append(card)

          cols = 4
          rows = (len(cards) + cols - 1) // cols
          sheet = Image.new('RGB', (cols*320, max(1, rows)*380), '#cccccc')
          for i, card in enumerate(cards):
              sheet.paste(card, ((i%cols)*320, (i//cols)*380))
          Path('inventory').mkdir()
          Path('inventory/report.tsv').write_text('\n'.join(report) + '\n', encoding='utf-8')
          sheet.save('inventory/contact-sheet.jpg', quality=90)
          print('\n'.join(report))
          PY

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: territory-image-inventory
          path: inventory/
          if-no-files-found: error
          retention-days: 7
